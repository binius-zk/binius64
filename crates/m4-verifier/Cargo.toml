[package]
name = "binius-m4-verifier"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
binius-core = { path = "../core" }
binius-field = { path = "../field" }
binius-hash = { path = "../hash" }
binius-iop = { path = "../iop" }
binius-ip = { path = "../ip" }
binius-transcript = { path = "../transcript" }
binius-utils = { path = "../utils" }
binius-verifier = { path = "../verifier" }
digest.workspace = true

[dev-dependencies]
# Building a composite constraint system by hand is impractical, so the tests build one with the
# circuit frontend. It depends only on `binius-core`, so this adds no cycle.
binius-frontend = { path = "../frontend" }
