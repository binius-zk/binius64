[package]
name = "binius-m4-prover"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# Enabled by the `test-circuits` feature only.
binius-circuits = { path = "../circuits", optional = true }
binius-core = { path = "../core" }
binius-field = { path = "../field" }
binius-frontend = { path = "../frontend" }
binius-hash = { path = "../hash" }
binius-iop-prover = { path = "../iop-prover" }
binius-ip = { path = "../ip" }
binius-compute = { path = "../compute" }
binius-ip-prover = { path = "../ip-prover" }
binius-m4-verifier = { path = "../m4-verifier" }
binius-math = { path = "../math" }
binius-prover = { path = "../prover" }
binius-transcript = { path = "../transcript" }
binius-utils = { path = "../utils" }
binius-verifier = { path = "../verifier" }
bytemuck.workspace = true
digest.workspace = true
# Enabled by the `test-circuits` feature only.
k256 = { workspace = true, features = ["arithmetic"], optional = true }
rand = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
assert_matches = { workspace = true }
binius-circuits = { path = "../circuits" }
binius-iop = { path = "../iop" }
binius-m4-prover = { path = ".", features = ["test-circuits"] }
binius-math = { path = "../math", features = ["test-utils"] }
criterion = { workspace = true }
proptest = { workspace = true }
rand = { workspace = true }
tracing-forest = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = []
rayon = ["binius-utils/rayon"]
# Circuits over primitives, shared by this crate's proving benchmarks and timing tests.
test-circuits = ["dep:binius-circuits", "dep:k256", "dep:rand"]

[[bench]]
name = "keccak_witness_gen"
harness = false

[[bench]]
name = "prove_hash_primitives"
harness = false

[[bench]]
name = "assemble_operation_witness"
harness = false
